# curriculo.yml — FUENTE ÚNICA de datos curriculares del proyecto Hugging Face.
#
# Hugging Face es TRANSVERSAL: se imparte en dos módulos del CE IA&BD (Comunitat
# Valenciana, 2026-2027):
#   - MIA (5071) «Modelos de Inteligencia Artificial»  -> RA1, RA2, RA5
#   - PIA (5072) «Programación de Inteligencia Artificial» -> RA3
#
# Nota: el enunciado exacto del RA3 de PIA (5072) está PENDIENTE de verificar
# contra el RD 279/2021 (Anexo del módulo 5072).

contexto:
  curso_especializacion: Inteligencia Artificial y Big Data (Grado E)
  centro: "I.E.S. Severo Ochoa de Elche"
  curso_academico: "2026-2027"
  profesor: "José Manuel Pérez Torres"
  herramienta: "Hugging Face (Transformers, Datasets, Hub, Tokenizers)"

modulos:
  - codigo: "5071"
    nombre: Modelos de Inteligencia Artificial (MIA)
    ra_impartidos_por_este_docente: [RA1, RA2, RA5]
    ra_huggingface:
      - id: RA1
        ce: 4
        enunciado: >-
          Caracteriza sistemas de Inteligencia Artificial relacionándolos con la mejora de la
          eficiencia operativa de las organizaciones y empresas.
        uso_hf: >-
          Introducción al ecosistema HF: Hub, modelos y datasets como catálogo de sistemas de IA.
      - id: RA2
        ce: 6
        enunciado: >-
          Utiliza modelos de sistemas de Inteligencia Artificial implementando sistemas de
          resolución de problemas.
        uso_hf: >-
          Núcleo del curso: pipelines, tokenizers, modelos preentrenados, inferencia y fine-tuning.
      - id: RA5
        ce: 5
        enunciado: >-
          Aplica sistemas expertos evaluando la influencia de los controladores inteligentes en el
          comportamiento del sistema.
        uso_hf: >-
          Uso de modelos como componente de sistemas expertos híbridos y guardarraíles de LLM.
  - codigo: "5072"
    nombre: Programación de Inteligencia Artificial (PIA)
    ra_impartidos_por_este_docente: [RA3]
    ra_huggingface:
      - id: RA3
        ce: null # PENDIENTE: verificar CE contra RD 279/2021
        enunciado: null # PENDIENTE: verificar enunciado oficial
        uso_hf: >-
          Procesamiento de lenguaje natural con HF: clasificación de texto, NER, QA,
          resumen, generación y transformers.

# Calendario del curso 2026-2027 (referencia; verificar contra DOGV/Resolución SAE).
calendario:
  inicio_docencia: 2026-10-01
  fin_maximo_legal: 2027-06-18
  dias_clase: [lunes, miércoles]
  duracion_sesion: 2h
  vacaciones:
    navidad: [2026-12-23, 2027-01-06]
    pascua: [2027-03-24, 2027-04-05]
  # Festivos que afectan a lun/mié: pendiente de concretar por centro.

# Evaluación (Orden 8/2025, CV): escala 1–10 sin decimales, nota mínima por RA = 5.
evaluacion:
  peso_actividades: 40
  peso_prueba_escrita: 60
  nota_minima_por_ra: 5
  escala_calificacion: 1 a 10, sin decimales
