site_name: Hugging Face — Apuntes y prácticas (CE IA&BD)
site_description: Materiales docentes sobre el ecosistema Hugging Face (Transformers, Datasets, Hub, Tokenizers, pipelines y fine-tuning) para el Curso de Especialización en IA y Big Data (Comunitat Valenciana, 2026-2027). Cubre RA1/RA2/RA3 de MIA (5071) y RA2/RA3 de PIA (5073).
site_author: José Manuel Pérez Torres
repo_url: https://github.com/jmperez-profesor/hf
site_url: https://jmperez-profesor.github.io/hf/

edit_uri: edit/main/docs
use_directory_urls: false

# Ocultar los cuadernos de soluciones mientras duran las clases.
# Para volver a mostrarlos, comenta o elimina las líneas siguientes.
exclude_docs: |
  sesiones/*_soluciones.ipynb

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - header.autohide

extra:
  colab:
    user: jmperez-profesor
    repo: hf
    branch: main
  raw_base: https://raw.githubusercontent.com/jmperez-profesor/hf/main

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
  - minify:
      minify_html: true
  - redirects
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.css

hooks:
  - hooks.py

nav:
  - Inicio: index.md
  - Sesiones:
      - "S29_31 · Introducción a Hugging Face":
          - "Guía de clase": sesiones/sesion29_31_introduccion.md
      - "S34 · Transformers, pipelines y tokenizadores":
          - "Guía de clase": sesiones/sesion34_transformers.md
          - "Notebooks":
              - "Ecosistema y pipelines": sesiones/sesion34_pipelines.ipynb
              - "Tokenizadores": sesiones/sesion34_tokenizadores.ipynb
              - "Transformers por dentro": sesiones/sesion34_transformers.ipynb
      - "S36 · La librería Datasets":
          - "Guía de clase": sesiones/sesion36_datasets.md
          - "Notebook": sesiones/sesion36_datasets.ipynb
      - "S39 · Fine-tuning con Trainer y Evaluate":
          - "Guía de clase": sesiones/sesion39_finetuning.md
          - "Notebook": sesiones/sesion39_finetuning.ipynb
      - "S42 · Visión, audio y multimodal":
          - "Guía de clase": sesiones/sesion42_vision_audio_multimodal.md
          - "Notebook": sesiones/sesion42_vision_audio_multimodal.ipynb
      - "S44 · Desplegar: Hub, Gradio y Spaces":
          - "Guía de clase": sesiones/sesion44_despliegue_gradio_spaces.md
          - "Notebook": sesiones/sesion44_despliegue_gradio_spaces.ipynb
  - "Relación con los RA": relacion_ra.md
  - Recursos:
      - "Entorno de trabajo": recursos/entorno.md
      - "Demos con Gradio (v5)": recursos/gradio_demos.md
      - "Migración transformers v4 → v5": recursos/migracion_v5.md
      - "Cuaderno v4 (pipelines)": recursos/cuaderno_v4_pipelines.ipynb
      - "Cuaderno v5 (Gradio + Hub)": recursos/cuaderno_v5_gradio.ipynb
      - "Vídeos educativos": recursos/videos.md
      - "Proyecto integrador · Visión": recursos/proyecto_vision.md
  - Evaluación:
      - Índice: evaluacion/index.md
      - "Retos semanales": evaluacion/retos.md
      - "Proyecto final (Space)": evaluacion/proyecto_final.md
