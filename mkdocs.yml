site_name: Hugging Face — Apuntes y prácticas (CE IA&BD)
site_description: Materiales docentes sobre el ecosistema Hugging Face (Transformers, Datasets, Hub, Tokenizers, pipelines y fine-tuning) para el Curso de Especialización en IA y Big Data (Comunitat Valenciana, 2026-2027). Cubre RA1/RA2/RA3 de MIA (5071) y RA2/RA3 de PIA (5073).
site_author: José Manuel Pérez Torres
repo_url: https://github.com/jmperez-profesor/hf
site_url: https://jmperez-profesor.github.io/hf/

edit_uri: edit/main/docs
use_directory_urls: false

# Ocultar los cuadernos de soluciones mientras duran las clases.
# Para volver a mostrarlos, comenta o elimina las líneas siguientes.
exclude_docs: |
  sesiones/*_soluciones.ipynb

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - header.autohide

extra:
  colab:
    user: jmperez-profesor
    repo: hf
    branch: main
  raw_base: https://raw.githubusercontent.com/jmperez-profesor/hf/main

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
  - minify:
      minify_html: true
  - redirects
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.css

hooks:
  - hooks.py

nav:
  - Inicio: index.md
  - Sesiones:
      - "S1 · Ecosistema y pipelines":
          - "Guía de clase": sesiones/sesion01_ecosistema_pipelines.md
          - "Notebook": sesiones/sesion01_ecosistema_pipelines.ipynb
      - "S2 · Tokenizadores":
          - "Guía de clase": sesiones/sesion02_tokenizadores.md
          - "Notebook": sesiones/sesion02_tokenizadores.ipynb
      - "S3 · Transformers por dentro":
          - "Guía de clase": sesiones/sesion03_transformers.md
          - "Notebook": sesiones/sesion03_transformers.ipynb
      - "S4 · Datasets y fine-tuning":
          - "Guía de clase": sesiones/sesion04_datasets_finetuning.md
          - "Notebook": sesiones/sesion04_datasets_finetuning.ipynb
      - "S5 · LLMs: generación, cuantización y LoRA":
          - "Guía de clase": sesiones/sesion05_llms.md
          - "Notebook": sesiones/sesion05_llms.ipynb
      - "S6 · Visión, audio y multimodal":
          - "Guía de clase": sesiones/sesion06_vision_audio_multimodal.md
          - "Notebook": sesiones/sesion06_vision_audio_multimodal.ipynb
      - "S7 · Desplegar: Hub, Gradio y Spaces":
          - "Guía de clase": sesiones/sesion07_despliegue_gradio_spaces.md
          - "Notebook": sesiones/sesion07_despliegue_gradio_spaces.ipynb
  - "Relación con los RA": relacion_ra.md
  - Evaluación:
      - Índice: evaluacion/index.md
      - "Retos semanales": evaluacion/retos.md
      - "Proyecto final (Space)": evaluacion/proyecto_final.md
